services:
  robosubzc:
    image: ghcr.io/RoboSubZC/robosubzc-workspace:latest
    build:
      context: .
      args:
        - USER_ID=${UID:-1000}
        - GROUP_ID=${GID:-1000}
        - USER_NAME=${USER_NAME:-dev}
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
      - HOST_SHELL=${SHELL}
      - USER_NAME=${USER_NAME:-dev}
      - WS_DIR=${WS_DIR:-RoboSubZC}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    volumes:
      - ~/.Xauthority:/home/${USER_NAME:-dev}/.Xauthority:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/home/${USER_NAME:-dev}/${WS_DIR:-RoboSubZC}:rw
    stdin_open: true
    tty: true