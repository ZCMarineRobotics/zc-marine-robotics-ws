services:
  robosubzc:
    image: ghcr.io/robosubzc/robosubzc-workspace:latest
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
      - HOST_SHELL=${SHELL}
      - USER_NAME=${USER_NAME:-dev}
      - WS_DIR=${WS_DIR:-RoboSubZC}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      # Universal Qt X11 crash prevention (Safe for Win/Mac/Linux)
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
    volumes:
      - ~/.Xauthority:/home/${USER_NAME:-dev}/.Xauthority:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/home/${USER_NAME:-dev}/${WS_DIR:-RoboSubZC}:rw
    stdin_open: true
    tty: true